[project]
name = "outlook-desktop-mcp"
version = "0.3.0"
description = "Outlook Desktop as an MCP server — Windows (COM) and macOS (AppleScript). No Graph API, no Entra app registration — just your local Outlook."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Andreas Martin Aanerud", email = "aaanerud@microsoft.com" },
]
keywords = ["mcp", "outlook", "email", "com", "applescript", "automation", "windows", "macos", "microsoft", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "pywin32>=310; sys_platform == 'win32'",
    # Upper bound is deliberate. mcp 2.0.0 moved mcp.server.fastmcp, so a
    # fresh install of this project against 2.x fails at import with
    # "No module named 'mcp.server.fastmcp'". Existing venvs built before
    # 2.0.0 released keep working only by accident of their install date.
    "mcp[cli]>=1.26.0,<2",
]

[project.urls]
Homepage = "https://github.com/aaanerud/outlook-desktop-mcp"
Repository = "https://github.com/aaanerud/outlook-desktop-mcp"
Issues = "https://github.com/aaanerud/outlook-desktop-mcp/issues"

[project.scripts]
outlook-desktop-mcp = "outlook_desktop_mcp.entrypoint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_desktop_mcp"]
